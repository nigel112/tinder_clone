name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish_apk_to_branch:
        description: 'Commit the built APK to a throwaway branch (debug: sandbox cannot read artifacts)'
        type: boolean
        default: false
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the Flutter release this project was built against:
      # .metadata revision 796c8ef7 (Flutter 3.13.x / Dart 3.1.x), which
      # satisfies the `sdk: '>=3.0.5 <4.0.0'` constraint in pubspec.yaml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Informational only - never blocks the APK artifact.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 7.3.0 + Gradle 7.5 require JDK 11 (JDK 17 needs AGP 7.4+).
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: stable
          cache: true

      # Best effort: GitHub runners normally ship with the SDK licenses
      # already accepted. Must never block the build if the probe fails.
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses
        continue-on-error: true

      - name: Install dependencies
        run: flutter pub get

      # TEMPORARY DEBUG: workflow log downloads are unreachable from the
      # dev sandbox, so mirror the tail of the build output onto a throwaway
      # branch. Remove once the build is green.
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
        continue-on-error: true

      - name: Publish build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 50000 build.log > build-failure.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B "ci-debug-${{ github.run_id }}"
          git add -f build-failure.log
          git commit -m "CI build log for run ${{ github.run_id }}"
          git push -f origin "ci-debug-${{ github.run_id }}"

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: zimdate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      # TEMPORARY DEBUG: artifact downloads are unreachable from the dev
      # sandbox, so mirror the APK onto a throwaway branch. Remove once the
      # artifact can be fetched directly.
      - name: Publish APK to throwaway branch
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B "apk-${{ github.run_id }}"
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/zimdate-release.apk
          git add -f apk/zimdate-release.apk
          git commit -m "ZimDate release APK for run ${{ github.run_id }}"
          git push -f origin "apk-${{ github.run_id }}"
