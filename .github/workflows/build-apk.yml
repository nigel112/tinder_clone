name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the Flutter release this project was built against:
      # .metadata revision 796c8ef7 (Flutter 3.13.x / Dart 3.1.x), which
      # satisfies the `sdk: '>=3.0.5 <4.0.0'` constraint in pubspec.yaml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Informational only - never blocks the APK artifact.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 7.3.0 + Gradle 7.5 require JDK 11 (JDK 17 needs AGP 7.4+).
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: flutter pub get

      # Signed with the debug key, because android/app/build.gradle maps the
      # release buildType to signingConfigs.debug. Installable, not store-ready.
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zimdate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
